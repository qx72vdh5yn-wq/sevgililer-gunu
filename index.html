<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgililer Günümüz Kutlu Olsun</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
    height:100vh;
    background:linear-gradient(135deg,#a855f7,#ec4899);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
    overflow:hidden;
}

/* Kart */
.card{
    background:rgba(255,255,255,0.18);
    padding:40px 25px;
    border-radius:25px;
    backdrop-filter:blur(14px);
    box-shadow:0 25px 50px rgba(0,0,0,0.35);
    max-width:92%;
    z-index:5;
}

/* Başlık */
.title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:18px;
}

h2{
    font-size:clamp(1.6rem,4vw,2.3rem);
    font-weight:700;
}

/* ❤️ SVG kalp */
.heart{
    width:42px;
    height:42px;
    animation:beat 1.6s infinite;
}
.heart svg{
    width:100%;
    height:100%;
    fill:#e11d48;
}

@keyframes beat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
}

/* Metin */
p{
    font-size:clamp(1rem,3vw,1.2rem);
    line-height:1.6;
}

/* ⭐🌻 Süzülen objeler */
.fall{
    position:absolute;
    top:-40px;
    animation:fall linear infinite;
    opacity:.9;
    z-index:1;
}
@keyframes fall{
    from{transform:translateY(0);opacity:0}
    to{transform:translateY(110vh);opacity:1}
}

/* 🐱 Zıplayan kediler */
.kitten{
    position:absolute;
    bottom:10px;
    font-size:34px;
    animation:hop 2.5s ease-in-out infinite;
    z-index:3;
}
@keyframes hop{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-80px)}
}

.tap{
    margin-top:18px;
    font-size:.95rem;
    opacity:.9;
}
</style>
</head>

<body onclick="enableSound()">

<!-- 🎵 MÜZİK -->
<audio id="music" loop>
    <source src="comptine.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <div class="title">
        <div class="heart">
            <svg viewBox="0 0 24 24">
                <path d="M12 21s-6.7-4.4-9.5-8C-0.5 9.5 2 4 7 4c2.2 0 4 1.3 5 3 1-1.7 2.8-3 5-3 5 0 7.5 5.5 4.5 9-2.8 3.6-9.5 8-9.5 8z"/>
            </svg>
        </div>

        <h2>SENİ ÇOK SEVİYORUM PAMUĞUM</h2>

        <div class="heart">
            <svg viewBox="0 0 24 24">
                <path d="M12 21s-6.7-4.4-9.5-8C-0.5 9.5 2 4 7 4c2.2 0 4 1.3 5 3 1-1.7 2.8-3 5-3 5 0 7.5 5.5 4.5 9-2.8 3.6-9.5 8-9.5 8z"/>
            </svg>
        </div>
    </div>

    <p>
        İyi ki varsın…<br>
        Sen benim en güzel mucizemsin.
    </p>

    <p style="margin-top:10px;">
        Sevgililer Günümüz kutlu olsun
    </p>

    <div class="tap">💫 Ekrana dokun sevgilim</div>
    <p style="margin-top:15px;font-size:.9rem;">∞ Sonsuza kadar ∞</p>
</div>

<script>
/* 🔊 Dokununca müzik 14. saniyeden başlasın */
let started=false;
function enableSound(){
    if(started) return;
    started=true;

    const music = document.getElementById("music");
    music.currentTime = 14; // ⏱️ 14. saniye
    music.play();
}

/* ⭐🌻 Yıldız & ayçiçeği */
const fallItems=["⭐","✨","🌻"];
function createFall(){
    const el=document.createElement("div");
    el.className="fall";
    el.innerText=fallItems[Math.floor(Math.random()*fallItems.length)];
    el.style.left=Math.random()*100+"vw";
    el.style.fontSize=(Math.random()*18+18)+"px";
    el.style.animationDuration=(Math.random()*5+6)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),11000);
}
setInterval(createFall,350);

/* 🐱 Kediler */
function createKitten(){
    const k=document.createElement("div");
    k.className="kitten";
    k.innerText="🐱";
    k.style.left=Math.random()*90+"vw";
    k.style.animationDuration=(Math.random()*1.5+2)+"s";
    document.body.appendChild(k);
    setTimeout(()=>k.remove(),9000);
}
setInterval(createKitten,2000);
</script>

</body>
</html>
